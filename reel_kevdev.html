<button onclick="downloadPNG()">↓ Descargar PNG (1080×1920)</button>
<p class="note">Abrí este archivo en Chrome o Firefox · El PNG se descarga en la resolución original</p>

<script>
function downloadPNG() {
  const svg = document.getElementById('reel-svg');
  const clone = svg.cloneNode(true);
  clone.setAttribute('width', '1080');
  clone.setAttribute('height', '1920');
  const data = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function () {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, 1080, 1920);
    ctx.drawImage(img, 0, 0, 1080, 1920);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'reel_kevdev_1080x1920.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  img.onerror = function() {
    alert('Para descargar el PNG, abrí este archivo directamente en Chrome (no en el visor de archivos). Luego hacé clic en el botón.');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
</script>
