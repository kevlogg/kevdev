<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión — KevDev</title>
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      background: rgba(24, 24, 24, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 255, 0.08);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 10px #00e5ff;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: rgba(232, 232, 232, 0.7);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00e5ff;
      color: #0c0c0c;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background: #33ebff;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 229, 255, 0.55);
    }
    .footer-note {
      margin-top: 24px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: rgba(232, 232, 232, 0.4);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="badge">
      <span class="pulse-dot"></span>
      MODO OFFLINE
    </div>
    <h1>Sin conexión a internet</h1>
    <p>
      Parece que perdiste la señal. Las secciones ya descargadas siguen disponibles en la PWA. Verificá tu red y reintentá.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      REINTENTAR CONEXIÓN
    </button>
    <div class="footer-note">
      KevDev Progressive Web App
    </div>
  </div>
</body>
</html>
