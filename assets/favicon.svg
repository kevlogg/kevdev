<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer glowing box -->
  <rect x="72" y="72" width="368" height="368" rx="72" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="6" />
  
  <!-- KD Text Emblem -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="210" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">KD</text>
  
  <!-- Corner Accent Dot -->
  <circle cx="390" cy="122" r="20" fill="#06b6d4" />
</svg>